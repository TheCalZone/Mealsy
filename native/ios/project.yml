name: MealsyExtensions
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    APPLICATION_EXTENSION_API_ONLY: YES
    SKIP_INSTALL: YES
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  MealsyShare:
    type: app-extension
    platform: iOS
    sources:
      - path: MealsyShare/ShareViewController.swift
      - path: MealsyShare/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.companyname.recipeapp.share
        INFOPLIST_FILE: MealsyShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: MealsyShare/MealsyShare.entitlements
    scheme: {}
  MealsyWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: MealsyWidget/MealsyWidget.swift
      - path: MealsyWidget/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.companyname.recipeapp.widget
        INFOPLIST_FILE: MealsyWidget/Info.plist
    scheme: {}
